syntax = "proto3";

package text2sql.v1;

option java_multiple_files = true;
option java_package = "com.project.text2sql.proto.v1";
option java_outer_classname = "Text2SqlProto";

service Text2SQLService {
  rpc ExecuteQuery(Text2SQLRequest) returns (Text2SQLResponse);
}

service SchemaService {
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
  rpc GetTableSchema(GetTableSchemaRequest) returns (GetTableSchemaResponse);
}

message Text2SQLRequest {
  string question = 1;
}

message Text2SQLResponse {
  string sql = 1;
  repeated string columns = 2;
  repeated Row rows = 3;
  double confidence = 4;
  string explanation = 5;
  int32 attempts = 6;
  int64 execution_time_ms = 7;
  string trace_id = 8;
}

message Row {
  repeated string values = 1;
}

message GetSchemaRequest {
  // Defaults to "public" if empty.
  string schema = 1;
}

message GetSchemaResponse {
  string database = 1;
  string schema = 2;
  int64 generated_at_epoch_ms = 3;
  int32 ttl_seconds = 4;
  repeated TableSchema tables = 5;
}

message GetTableSchemaRequest {
  // Defaults to "public" if empty.
  string schema = 1;
  string table = 2;
}

message GetTableSchemaResponse {
  TableSchema table = 1;
  int64 generated_at_epoch_ms = 2;
  int32 ttl_seconds = 3;
}

message TableSchema {
  string schema = 1;
  string name = 2;
  string comment = 3;
  repeated ColumnSchema columns = 4;
  repeated string primary_key_columns = 5;
  repeated ForeignKeySchema foreign_keys = 6;
  repeated IndexSchema indexes = 7;
}

message ColumnSchema {
  string name = 1;
  string data_type = 2;
  bool nullable = 3;
  string default_value = 4;
  string comment = 5;
}

message ForeignKeySchema {
  string name = 1;
  repeated string columns = 2;
  string references_schema = 3;
  string references_table = 4;
  repeated string references_columns = 5;
}

message IndexSchema {
  string name = 1;
  bool unique = 2;
  repeated string columns = 3;
}