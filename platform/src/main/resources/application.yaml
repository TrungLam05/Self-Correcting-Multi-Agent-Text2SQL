spring:
  application:
    name: text2sql-platform

server:
  port: 8080

text2sql:
  db:
    jdbcUrl: jdbc:postgresql://localhost:5432/analytics
    username: app_readonly
    password: app_readonly_password
    queryTimeoutSeconds: 5
    defaultLimit: 200
  schema:
    cacheTtlSeconds: 300
    allowedSchemas:
      - public
  executor:
    maxSqlLength: 20000
    defaultLimit: 200
    maxLimit: 1000
    queryTimeoutSeconds: 5
  rate-limit:
    requestsPerMinute: 30
  concurrency:
    maxConcurrentQueries: 4